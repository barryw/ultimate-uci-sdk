# The whole program fits below bitmap A at $4000; no blob or C runtime.
MEMORY {
    LOADADDR: start = $07ff, size = 2, file = %O;
    MAIN: start = $0801, size = $37ff, file = %O;
}
SEGMENTS {
    LOADADDR: load = LOADADDR, type = ro;
    STARTUP: load = MAIN, type = ro, start = $0801;
    DEMO: load = MAIN, type = rw, start = $0900;
    CODE: load = MAIN, type = rw;
    RODATA: load = MAIN, type = ro, optional = yes;
}
