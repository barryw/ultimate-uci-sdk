# Main code/sprites below $2000, original support routines above it, SDK at $4000.
MEMORY {
    LOADADDR: start = $07ff, size = 2, file = %O;
    MAIN: start = $0801, size = $37ff, file = %O, fill = yes;
    SDK: start = $4000, size = $5f00, file = %O;
}
SEGMENTS {
    LOADADDR: load = LOADADDR, type = ro;
    STARTUP: load = MAIN, type = ro, start = $0801;
    MAIN: load = MAIN, type = rw, start = $0900;
    LIBCODE: load = MAIN, type = rw, start = $2000;
    CODE: load = SDK, type = rw;
    RODATA: load = SDK, type = ro;
}
