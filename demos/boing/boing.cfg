# Keep VIC assets and both PCM pieces at their established addresses.
MEMORY {
    LOADADDR: start = $07ff, size = 2, file = %O;
    MAIN: start = $0801, size = $f7f9, file = %O, fill = yes;
}
SEGMENTS {
    LOADADDR: load = LOADADDR, type = ro;
    STARTUP: load = MAIN, type = ro, start = $0801;
    DEMO: load = MAIN, type = rw, start = $0900;
    SCREEN: load = MAIN, type = ro, start = $4000;
    SHADOW: load = MAIN, type = ro, start = $4c00;
    BITMAP: load = MAIN, type = ro, start = $6000;
    CODE: load = MAIN, type = rw, start = $8000;
    RODATA: load = MAIN, type = ro;
    PCM: load = MAIN, type = ro, start = $ad30;
    PCM2: load = MAIN, type = ro, start = $e000;
}
