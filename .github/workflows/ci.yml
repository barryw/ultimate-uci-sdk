# SPDX-License-Identifier: MIT
name: ci

on:
  push:
  pull_request:

jobs:
  generated:
    name: generated files are current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the generated constants are up to date
        run: |
          python3 tools/gen_protocol.py
          python3 tools/gen_keywords.py
          python3 tools/gen_coverage.py
          git diff --exit-code -- include/uci_protocol.h bindings/asm/uci_protocol.inc bindings/asm/uci_argtable.inc bindings/asm/uci_keywords.inc bindings/kickass/uci_protocol.asm bindings/acme/uci_protocol.a docs/generated
      - name: Fail on an SDK entry point with no test behind it
        run: make coverage

  build:
    name: cc65 build and examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install cc65 and ACME
        # ACME is here for tools/test_generated_assembles.py, which feeds the
        # generated constant files to the assemblers they are written for. It
        # skips when the tool is missing, so without this line the check would
        # pass by never running.
        run: sudo apt-get update && sudo apt-get install -y cc65 acme
      - name: Build the library
        run: make lib
      - name: Build the assembly and cc65 examples
        run: |
          make -C examples/asm
          make -C examples/cc65
      - name: Build the hardware test program
        run: make hardware
      - name: Build the BASIC wedge, both deliveries
        run: make wedge
      # The wedge is the consumer of both generated tables now, so `make wedge`
      # above is what proves they still assemble.
      - name: Run the host unit tests
        # The generators, the CRUNCH model, the charmap rule, the register
        # boundary and the blob's published offsets. They need the wedge built,
        # which is why they run in this job and not in the one above.
        run: make unittest
      - uses: actions/upload-artifact@v4
        with:
          name: prg
          path: |
            examples/asm/identify.prg
            examples/cc65/identify.prg
            tests/hardware/ucitest.prg
            src/basic/uci.prg
            src/basic/uci.crt

  emulator:
    name: sim6502 emulator tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install cc65
        run: sudo apt-get update && sudo apt-get install -y cc65
      - name: Run the SDK against a simulated Ultimate
        run: make emulator
