# ld65 configuration for the cartridge build.
#
# An 8K image at $8000 with the CBM80 autostart signature in its first bytes.
# CODE and RODATA are the same segments the .prg carries; they load into ROM
# here and run at $C000, and the cold start copies them across before anything
# calls them. ROM cannot hold the wedge's state, and the wedge deliberately
# keeps its state beside its code, so the copy is not optional.
#
# The image is filled to exactly 8192 bytes because that is what a CHIP packet
# in a .crt declares, and a short one would leave the cartridge reading whatever
# followed it.
#
# SPDX-License-Identifier: MIT

MEMORY {
    ROM:      file = %O, start = $8000, size = $2000, fill = yes, fillval = $FF;
    WEDGERAM: file = "", start = $C000, size = $1000, define = yes;
}

SEGMENTS {
    CARTHDR:  load = ROM, type = ro;
    LOADER:   load = ROM, type = ro;
    CODE:     load = ROM, run = WEDGERAM, type = ro, define = yes;
    RODATA:   load = ROM, run = WEDGERAM, type = ro, define = yes;
    BSS:      load = WEDGERAM, type = bss, define = yes;
}
