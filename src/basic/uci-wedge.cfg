# ld65 configuration for the BASIC wedge .prg.
#
# CODE and RODATA hold the wedge and the SDK. They load with the rest of the
# .prg and run at $C000, and the loader copies them there before installing
# anything. That split has to exist: the loader performs a NEW so $0801 is the
# user's again, and a BASIC program growing from there would otherwise write
# straight over the transport.
#
# The loader itself stays where it loaded - it is the thing doing the copying -
# so it lives in its own segment rather than in CODE.
#
# The wedge itself is at $C000 rather than $A000 because IGONE is called by
# BASIC ROM, and a handler under the ROM would need a trampoline per hook and
# $01 juggling around every call into routines the wedge uses to parse its own
# arguments.
#
# **The SDK is a different proposition, and it lives at $A000.** It is never
# called by BASIC ROM and calls no BASIC routine, so reaching it costs one
# twelve-byte stub per entry point - see bank.s - rather than banking
# discipline throughout. That buys the whole 4K block back for the wedge, which
# Phase 3 needs: the two together no longer fit in it.
#
# Its RODATA deliberately stays at $C000 with the wedge's. Data is read, not
# executed, and $C000 is RAM whatever $01 says, so leaving it there costs
# nothing and keeps one copy loop instead of three.
#
# BSS runs at $C000 too, after the code, and is never copied - it holds the
# argument, reply and status buffers, which have no initial value worth moving.
#
# SPDX-License-Identifier: MIT

FEATURES {
    STARTADDRESS: default = $0801;
}

MEMORY {
    LOADADDR: file = %O, start = %S - 2,  size = $0002;
    MAIN:     file = %O, start = %S,      size = $B000 - %S;
    WEDGERAM: file = "", start = $C000,   size = $1000, define = yes;
    UCIRAM:   file = "", start = $A000,   size = $2000, define = yes;
}

SEGMENTS {
    LOADADDR: load = LOADADDR, type = ro;
    BASSTUB:  load = MAIN,     type = ro;
    LOADER:   load = MAIN,     type = ro;
    CODE:     load = MAIN,     run  = WEDGERAM, type = ro, define = yes;
    RODATA:   load = MAIN,     run  = WEDGERAM, type = ro, define = yes;
    UCICODE:  load = MAIN,     run  = UCIRAM,   type = ro, define = yes;
    BSS:      load = WEDGERAM, type = bss, define = yes;
}
