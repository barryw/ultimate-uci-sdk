# ld65 configuration for the BASIC wedge .prg.
#
# The wedge is assembled to run at $C000 but travels inside the .prg, so the
# WEDGE segment loads with everything else and runs somewhere else. ld65's
# load/run split is what makes that a link-time fact rather than something the
# loader has to know: it exports __WEDGE_LOAD__, __WEDGE_RUN__ and
# __WEDGE_SIZE__, and the loader copies between them.
#
# $C000 rather than $A000 because IGONE is called by BASIC ROM, and a handler
# under the ROM would need a trampoline per hook and $01 juggling around every
# call into routines the wedge has to use to parse its own arguments.
#
# SPDX-License-Identifier: MIT

FEATURES {
    STARTADDRESS: default = $0801;
}

MEMORY {
    LOADADDR: file = %O, start = %S - 2,  size = $0002;
    MAIN:     file = %O, start = %S,      size = $B000 - %S;
    WEDGERAM: file = "", start = $C000,   size = $1000, define = yes;
}

SEGMENTS {
    LOADADDR: load = LOADADDR, type = ro;
    BASSTUB:  load = MAIN,     type = ro;
    CODE:     load = MAIN,     type = ro;
    RODATA:   load = MAIN,     type = ro,  optional = yes;
    WEDGE:    load = MAIN,     run  = WEDGERAM, type = ro, define = yes;
}
